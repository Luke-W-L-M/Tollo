/* ---------- money and dashboard numbers ---------- */
const money2 = n => '£' + (Math.round(n * 100) / 100).toFixed(2);
const WEEK = 7 * 86400000;
function moneyStats() {
  const all = Object.values(Live.docs).map(normJob), now = Date.now();
  const weeks = Array.from({ length: 8 }, (_, i) => ({ start: CAL_START.getTime() - (7 - i) * WEEK, amt: 0, jobs: 0, hours: 0 }));
  let done = 0, ahead = 0;
  all.forEach(j => {
    let amt;
    if (work()) { const me = j.crew.find(c => c.wid === TAB_ID); if (!me) return; amt = (me.rate || j.rate) * j.hours + (j.urgent ? j.bonus : 0); }
    else { if (j.ownerTab !== TAB_ID || !j.crew.length) return; const wages = j.crew.reduce((a, c) => a + (c.rate || j.rate) * j.hours + (j.urgent ? j.bonus : 0), 0); amt = wages * 1.1; }
    if (j.t0 + j.hours * 3600000 <= now) {
      done += amt;
      const w = weeks.find(w => j.t0 >= w.start && j.t0 < w.start + WEEK); if (w) { w.amt += amt; w.jobs++; w.hours += j.hours; }
    } else ahead += amt;
  });
  weeks.forEach(w => { const d = new Date(w.start); w.label = d.getDate() + ' ' + MON[d.getMonth()]; });
  return { done, ahead, weeks };
}
function syncBookings() {
  BOOKINGS.length = 0;
  JOBS.forEach(j => {
    const mine = work() ? MK.opted[j.id] : j.ownerTab === TAB_ID;
    if (!mine) return;
    const me = j.crew.find(c => c.wid === TAB_ID);
    BOOKINGS.push({ id: j.id, t0: j.t0, day: TODAY_IDX + j.off, start: j.start, end: j.start + j.hours, title: j.title, place: j.area, rate: me ? me.rate || j.rate : j.rate, kit: j.kit.join(', ') || 'None', who: work() ? j.who : (j.crew.length ? j.crew.map(c => c.name).join(', ') : 'No one yet'), crew: j.crew.length, need: j.need });
  });
}

/* ---------- page lock scrolling on the dashboard ---------- */
function setPage(n) {

}

  let el = target;

  const abs = Math.abs(e.deltaY) * (e.deltaMode === 1 ? 16 : 1);

  pstep: a => { const [k, d] = a.split(':'); const lim = { hours: [2, 12], need: [1, 8] }[k]; POST[k] = Math.max(lim[0], Math.min(lim[1], +POST[k] + +d)); $('#postFormWrap').innerHTML = postFormHTML(); $('#postPreview').innerHTML = postPreviewHTML(); },
  purgent: () => { POST.urgent = !POST.urgent; $('#postFormWrap').innerHTML = postFormHTML(); $('#postPreview').innerHTML = postPreviewHTML(); },
  pkitMust: () => { POST.kitMust = !POST.kitMust; $('#postFormWrap').innerHTML = postFormHTML(); },
  pkitAdd: () => { const v = POST.kitDraft.trim(); if (v) { POST.kit.push({ n: v, req: POST.kitMust }); POST.kitDraft = ''; } $('#postFormWrap').innerHTML = postFormHTML(); $('#postPreview').innerHTML = postPreviewHTML(); const k = $('#pKit'); if (k) k.focus(); },
  pkitDel: a => { POST.kit.splice(+a, 1); $('#postFormWrap').innerHTML = postFormHTML(); $('#postPreview').innerHTML = postPreviewHTML(); },
  cancelListing: a => { S.confirm = null; Object.values(Live.msgs).filter(m => m.job === a).forEach(m => Live.unsay(m.id)); Live.remove(a); },
  clearDemo: () => { Object.keys(Live.msgs).forEach(id => Live.unsay(id)); Object.keys(Live.docs).forEach(id => Live.remove(id)); },
  confirm: a => { S.confirm = a; refreshScreen(); const c = $('.confirm'); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); },
  confirmNo: () => { S.confirm = null; refreshScreen(); },
  openThread: a => openThread(a),
  closeThread: () => { S.thread = null; const sh = $('#msgShell'); if (sh) sh.classList.remove('inThread'); const tl = $('#threadList'); if (tl) tl.innerHTML = threadListHTML(); const a = document.activeElement; if (a && a.blur) a.blur(); },
  quickSay: a => sendMsg(a),
  viewJob: a => { if (work()) { MK.sel = a; MK.sheet = innerWidth <= 900; go('jobs'); } else go('listings'); },
  mapOpen: a => { const i = a.indexOf(':'); if (i < 0) openMap('area'); else openMap('job', a.slice(i + 1)); },
  demo: a => {
    const w = a === 'work';
    Object.assign(S, { role: a, first: w ? 'Alex' : 'Hannah', last: w ? 'Morgan' : 'Reid', postcode: w ? 'SW11 4NJ' : 'SW4 7AA', phone: '07700 900123', dobD: '14', dobM: '03', dobY: '1999', idStep: w ? 'done' : 'idle', species: pick(SPECIES).id, color: pick(COLOURS)[0], extra: pick(EXTRAS)[0], pers: pick(Object.keys(PERS)), buddyName: pick(NAMES) });
    go('home');
  },
  selJob: a => {
    MK.sel = a; MK.sheet = innerWidth <= 900;
    $$('.job').forEach(el => el.classList.toggle('on', el.dataset.arg === a));
    const d = $('#mkDetail'); if (d) { d.innerHTML = mkDetailHTML(); hydrate(d); d.classList.toggle('sheet', MK.sheet); d.scrollTop = 0; }
  },
  closeSheet: () => { MK.sheet = false; const d = $('#mkDetail'); if (d) d.classList.remove('sheet'); },
  quickOpt: (a, t) => optIn(a, t),
  optIn: (a, t) => optIn(a, t),
  withdraw: a => { S.confirm = null; dropOut(a); },
  saveJob: (a, t) => { MK.saved[a] = !MK.saved[a]; if (MK.saved[a]) { const r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 'heart', 2); } mkRefresh(true); },
  mkTab: a => { MK.tab = a; MK.sel = null; mkRefresh(); },
  mkWhen: a => { MK.when = a; MK.sel = null; mkRefresh(); },
  mkType: a => { MK.types = MK.types.includes(a) ? MK.types.filter(x => x !== a) : MK.types.concat([a]); MK.sel = null; mkRefresh(); },
  mkWithin: () => { MK.within = !MK.within; mkRefresh(); },
  mkClear: () => { Object.assign(MK, { tab: 'all', types: [], when: 'any', within: true, q: '', sel: null }); mkRefresh(); },
  page: a => setPage(+a),
  openTile: a => { S.tile = a; S.job = null; renderTiles(); if (a === 'calendar') { const c = $('#calScroll'); if (c) { c.scrollTop = 44 * 1.5; const t = c.querySelector('.calHead.today'); if (t && c.scrollWidth > c.clientWidth) c.scrollLeft = t.offsetLeft - 56; } } },
  closeTile: () => { S.tile = null; S.job = null; renderTiles(); },
  calWeek: a => { S.calWeek = +a; S.job = null; renderTiles(); },
  openJob: a => { const c = $('#calScroll'); const top = c ? c.scrollTop : 0; S.job = a; renderTiles(); const n = $('#calScroll'); if (n) n.scrollTop = top; },
  closeJob: () => { const c = $('#calScroll'); const top = c ? c.scrollTop : 0; S.job = null; renderTiles(); const n = $('#calScroll'); if (n) n.scrollTop = top; },
  skill: (a, t) => {
    S.skills = S.skills.includes(a) ? S.skills.filter(x => x !== a) : S.skills.concat([a]);
    const on = S.skills.includes(a);
    t.classList.toggle('on', on); t.setAttribute('aria-pressed', on);
    const c = $('#skillsCount'); if (c) c.textContent = S.skills.length;
  },
  restart: () => { cleanup('home'); cleanup('builder'); S = INIT(); MK = mkInit(); go('signup'); }
};
function randHex() {
  const h = Math.random() * 360, s = 0.5 + Math.random() * 0.3, l = 0.6 + Math.random() * 0.14;
  const f = n => { const k = (n + h / 30) % 12; const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return '#' + f(0) + f(8) + f(4);
}

const app = $('#app');
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !app.contains(t)) return;
  if (t.tagName === 'A') e.preventDefault();
  const fn = ACT[t.dataset.act];
  if (fn) fn(t.dataset.arg, t, e);
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'postForm') { submitPost(); return; }
  if (e.target.id === 'chatForm') { const t = $('#chatIn'); const v = t.value; t.value = ''; t.style.height = ''; sendMsg(v); t.focus(); return; }
  if (e.target.id === 'addSkill') {
    const inp = $('#newSkill'); const v = inp.value.trim();
    if (v && !S.skills.includes(v)) { S.skills.push(v); renderTiles(); const n = $('#newSkill'); if (n) n.focus(); }
    return;
  }
  go('side');
});
app.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field;
  if (!f) return;
  let v = e.target.value;
  if (f === 'dobD' || f === 'dobM') { v = v.replace(/\D/g, '').slice(0, 2); e.target.value = v; }
  if (f === 'dobY') { v = v.replace(/\D/g, '').slice(0, 4); e.target.value = v; }
  if (f === 'radius') {
    S.radius = +v;
    updateRings();
    $$('[data-radtext]').forEach(s => { s.textContent = S.radius; });
    const n = JOBS.filter(j => j.dist <= S.radius).length; $$('[data-ringcount]').forEach(s => { s.textContent = n; });
    return;
  }
  S[f] = v;
  if (f === 'postcode') JOBS.forEach(setGeo);
  if (S.screen === 'details') updateDetails();
  if (f === 'color') { const p = portalEl('builder'); if (p) { const el = p.querySelector('.mover .av'); if (el) mountAvatar(el, buddyOpts('builder')); } $$('.sw').forEach(b => b.classList.remove('on')); }
});
app.addEventListener('input', e => {
  const id = e.target.id;
  if (e.target.dataset && e.target.dataset.pf) {
    const k = e.target.dataset.pf; let v = e.target.value;
    if (k === 'rate') { v = v.replace(/[^0-9.]/g, '').slice(0, 5); e.target.value = v; const n = parseFloat(v); if (!(n >= 5 && n <= 60)) return; v = n; }
    POST[k] = v; if (k !== 'kitDraft') { const pv = $('#postPreview'); if (pv) pv.innerHTML = postPreviewHTML(); }
    if (k === 'area') { const h = $('#areaHint'); if (h) h.innerHTML = areaHint(); }
    return;
  }
  if (id === 'mkQ') { MK.q = e.target.value; MK.sel = null; mkRefreshKeepSearch(); }
  if (id === 'profMin') { const v = parseFloat(e.target.value.replace(/[^0-9.]/g, '')); if (v >= 5 && v <= 50) S.minRate = Math.round(v * 100) / 100; }
  if (id === 'chatIn') { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 130) + 'px'; }
});
app.addEventListener('keydown', e => {
  if (e.target.id === 'chatIn' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) { e.preventDefault(); $('#chatForm').requestSubmit(); }
});
app.addEventListener('pointerdown', e => { if (e.target.closest('.sendBtn')) e.preventDefault(); });
app.addEventListener('scroll', e => { if (e.target.id === 'chatBody') e.target._stick = nearBottom(e.target); }, true);
const mapBox = $('#mapModal');
mapBox.addEventListener('click', e => { if (e.target === mapBox || e.target.closest('[data-mclose]')) closeMap(); });
app.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.pf && e.target.tagName === 'SELECT') { POST[e.target.dataset.pf] = e.target.value; const pv = $('#postPreview'); if (pv) pv.innerHTML = postPreviewHTML(); return; }
  if (e.target.id === 'mkSort') { MK.sort = e.target.value; mkRefresh(); return; }
  if (e.target.dataset && e.target.dataset.kit) { const k = e.target.dataset.kit; MK.kit[k] = MK.kit[k] || {}; MK.kit[k][e.target.dataset.name] = e.target.checked; mkRefresh(true); return; } if (e.target.id === 'anyColour' && S.screen === 'avatar') render(); });
addEventListener('click', e => {
  if (S.screen !== 'home') return;
  if (e.target.closest('button, a, input, label, select, textarea, form, .tile, .film')) return;
  burst(e.clientX, e.clientY, pick(['heart', 'star', 'note', 'sparkle']), 1);
  if (S.sleeping) wake();
});

Live.start();
render();
requestAnimationFrame(loop);
})();
</script>
